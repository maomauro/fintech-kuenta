name: Publicar sitio

# En un pull request solo se comprueba que la imagen se construye. En main se publica en GHCR.
on:
  pull_request:
    paths:
      - "docs/**"
      - "diagramas/**"
      - "sitio/**"
      - "infraestructura/sitio/**"
      - ".dockerignore"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "diagramas/**"
      - "sitio/**"
      - "infraestructura/sitio/**"
      - ".dockerignore"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publicar-sitio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Iniciar sesión en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/fintech-kuenta-sitio
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Construir y publicar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infraestructura/sitio/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
