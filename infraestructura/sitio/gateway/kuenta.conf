# Kuenta. Sitio estático de documentación. Llega a kuenta-web por la red sitiosapps-edge (alias kuenta-web).
# Copiar a nginx/conf.d/kuenta.conf del repositorio del gateway; sigue el patrón de colfe.conf.

server {
    listen 443 ssl;
    http2 on;
    server_name kuenta.sitiosapps.com;

    ssl_certificate     /etc/nginx/ssl/kuenta.sitiosapps.com.pem;
    ssl_certificate_key /etc/nginx/ssl/kuenta.sitiosapps.com.key;
    include /etc/nginx/snippets/origen-cloudflare.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;

    set $kuenta_upstream http://kuenta-web:80;
    location / {
        include /etc/nginx/snippets/proxy-comun.conf;
        proxy_pass $kuenta_upstream;
    }
}
